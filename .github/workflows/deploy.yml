name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm generate
        env:
          # Сайт живёт в подпапке https://<user>.github.io/<repo>/
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
          # Ключи — в Settings → Secrets and variables → Actions → Variables
          NUXT_PUBLIC_YANDEX_MAPS_APIKEY: ${{ vars.YANDEX_MAPS_APIKEY }}
          NUXT_PUBLIC_YMAPS2_APIKEY: ${{ vars.YMAPS2_APIKEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
